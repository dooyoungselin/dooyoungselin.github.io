<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2eb">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="우리의 소중한 날을 전할 모바일 청첩장을 준비하고 있습니다.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dooyoung &amp; Selin">
    <meta property="og:description" content="우리의 소중한 날을 전할 청첩장을 준비하고 있습니다.">
    <meta property="og:url" content="https://dooyoungselin.com/">
    <link rel="canonical" href="https://dooyoungselin.com/">
    <title>Dooyoung &amp; Selin</title>
    <style>
      :root { color-scheme: light; background: #f5f2eb; color: #393d33; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 48px 24px; }
      article { width: min(100%, 460px); text-align: center; padding: 60px 16px; border-top: 1px solid #c7cbbd; border-bottom: 1px solid #c7cbbd; }
      .eyebrow { margin: 0 0 42px; color: #637057; font-size: 10px; letter-spacing: .25em; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(42px, 11vw, 60px); font-weight: 400; line-height: 1.15; }
      h1 span { display: block; }
      .ampersand { padding: 10px 0; color: #7c866b; font-size: .6em; font-style: italic; }
      .message { margin: 40px 0 0; font-size: 14px; line-height: 2; word-break: keep-all; }
      footer { margin-top: 38px; color: #73786a; font-size: 11px; letter-spacing: .09em; }
    </style>
  </head>
  <body>
    <main>
      <article aria-labelledby="couple-names">
        <p class="eyebrow">OUR WEDDING INVITATION</p>
        <h1 id="couple-names"><span>Dooyoung</span><span class="ampersand">&amp;</span><span>Selin</span></h1>
        <p class="message">우리의 소중한 날을 전할<br>청첩장을 준비하고 있습니다.</p>
        <footer>dooyoungselin.com</footer>
      </article>
    </main>
  </body>
</html>
